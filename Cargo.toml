[workspace]
resolver = "2"
members  = [
    "crates/mx-core",
    "crates/mx-config",
    "crates/mx-tui",
    "crates/mx-fs",
    "crates/mx-preview",
    "crates/mx",
]

[workspace.package]
edition       = "2021"
rust-version  = "1.85"
authors       = ["Bártházi András and Midnight X contributors"]
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/boogie/midnight-x"
homepage      = "https://github.com/boogie/midnight-x"
readme        = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"

[workspace.dependencies]
camino             = { version = "1.1", features = ["serde1"] }
chrono             = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm          = "0.28"
directories        = "5"
pico-args          = "0.5"
ratatui            = { version = "0.28", default-features = false, features = ["crossterm"] }
serde              = { version = "1", features = ["derive"] }
thiserror          = "1"
toml               = "0.8"
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"

# dev-dependencies (pinned in workspace for consistency)
insta              = { version = "1.40", features = ["yaml"] }
tempfile           = "3"
assert_cmd         = "2"

# Internal crates
mx-core            = { path = "crates/mx-core" }
mx-config          = { path = "crates/mx-config" }
mx-tui             = { path = "crates/mx-tui" }
mx-fs              = { path = "crates/mx-fs" }
mx-preview         = { path = "crates/mx-preview" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
