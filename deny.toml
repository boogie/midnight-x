[advisories]
yanked = "warn"
ignore = [
    # `paste` is unmaintained but pulled in transitively via ratatui. No
    # actively-maintained drop-in replacement upstream uses it yet. Track
    # ratatui releases and remove this exemption when ratatui drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
